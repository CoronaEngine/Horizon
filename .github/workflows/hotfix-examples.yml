name: Portable Hotfix Examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HORIZON_CONAN_EXPORT_LOCAL_RECIPES: "true"
  HORIZON_DEV_BOOTSTRAP_ACTIVE: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "3"

jobs:
  build:
    name: ${{ matrix.name }} Portable Hotfix Example
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools
        run: python -m pip install "conan>=2.28,<3" "cmake>=4.0" ninja

      - name: Prefer pip build tools
        shell: python
        run: |
          import os
          import sysconfig
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as output:
              output.write(sysconfig.get_path("scripts") + "\n")

      - name: Build the portable example and patch module
        shell: bash
        run: |
          mkdir -p build/verification
          {
            python build_tools/dev.py install --configuration Debug --target-family examples
            cmake --preset examples-debug -DHORIZON_ENABLE_EXAMPLE_HOTFIX=ON
            python build_tools/dev.py build-fast HorizonExamples horizon-baseline-hotfix-patch \
              --configuration Debug --target-family examples
          } 2>&1 | tee build/verification/portable-hotfix-example.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-hotfix-example-${{ matrix.os }}
          path: build/verification/portable-hotfix-example.log
          if-no-files-found: warn
